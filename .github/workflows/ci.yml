name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        # Version is read from "packageManager" in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build shared packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Prisma schema
        run: pnpm --filter @ogs/api prisma:validate

  infrastructure:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose.yaml
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env.example config --quiet

  integration:
    name: Integration tests (PostgreSQL + Redis, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Placeholder credentials from the committed templates: CI-only, throwaway containers.
      - name: Create .env files from templates
        run: pnpm setup:env

      # Same Compose file and role bootstrap as local development (the initdb hook
      # creates ogs_owner/ogs_app/ogs_readonly/ogs_maint and the ogs_test database).
      - name: Start PostgreSQL and Redis
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env up -d --wait

      - name: Apply migrations to the dev database (smoke test of db:migrate)
        run: pnpm build:packages && pnpm db:migrate

      - name: Integration tests
        run: pnpm --filter @ogs/api test:integration

      - name: Database and queue logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env logs --no-color

  e2e:
    name: Browser tests (Playwright journeys, design suites, Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env files from templates
        run: pnpm setup:env

      - name: Start PostgreSQL, Redis, Mailpit and the object store
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env up -d --wait

      - name: Migrate and seed the database
        run: pnpm build:packages && pnpm db:migrate && pnpm db:seed

      # Browsers download in seconds; the slow part used to be apt installing
      # Chromium's system libraries from a throttled mirror (12+ minutes). The
      # runner image already ships Chrome, so usually nothing is missing.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ogs/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium headless shell (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ogs/web exec playwright install --only-shell chromium

      # `install-deps --dry-run` simulates the apt install (Playwright >= 1.64) and
      # lists what is missing. On ubuntu-latest every library Chromium needs is
      # present; only extra fonts (CJK, Thai, Cyrillic, 21 MB) are missing, and
      # they once took 12 minutes from a throttled mirror. The app self-hosts
      # its Latin web fonts (Phase 6b), so screenshots do not depend on system
      # fonts and those packages are skipped; any other missing package is
      # installed. Unrecognised output falls back to installing all.
      - name: Install missing Chromium system libraries
        run: |
          out=$(pnpm --filter @ogs/web exec playwright install-deps --dry-run chromium 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -q "All system dependencies are installed."; then
            exit 0
          fi
          if ! echo "$out" | grep -q "Missing system dependencies"; then
            echo "::warning::Could not check Chromium's system libraries; installing all of them."
            pnpm --filter @ogs/web exec playwright install-deps chromium
            exit 0
          fi
          libs=$(echo "$out" | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p' | grep -vE '^x?fonts-' || true)
          if [ -z "$libs" ]; then
            echo "Only fonts are missing; not needed for these tests."
          else
            echo "Installing:" $libs
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends $libs
          fi

      - name: Build and run the browser tests
        run: pnpm test:e2e

      # Phase 6b: the Linux screenshots are the reference. When a baseline is
      # missing, Playwright writes it; download this artifact and commit the
      # images under apps/web/e2e/__screenshots__/.
      - name: Upload new screenshot baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines-linux
          path: apps/web/e2e/__screenshots__/**/*-linux.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      # Lighthouse CI on /services, mobile: performance >= 85, accessibility >= 95
      # (apps/web/lighthouserc.cjs). Uses the production build from test:e2e.
      - name: Lighthouse CI
        run: |
          pnpm --filter @ogs/api start > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/v1/health/ready > /dev/null && break
            sleep 1
          done
          pnpm --filter @ogs/web lighthouse

      - name: Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/lighthouse-report
          if-no-files-found: ignore
          retention-days: 14
