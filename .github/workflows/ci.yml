name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        # Version is read from "packageManager" in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build shared packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Prisma schema
        run: pnpm --filter @ogs/api prisma:validate

  infrastructure:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose.yaml
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env.example config --quiet

  integration:
    name: Integration tests (PostgreSQL + Redis, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Placeholder credentials from the committed templates: CI-only, throwaway containers.
      - name: Create .env files from templates
        run: pnpm setup:env

      # Same Compose file and role bootstrap as local development (the initdb hook
      # creates ogs_owner/ogs_app/ogs_readonly/ogs_maint and the ogs_test database).
      - name: Start PostgreSQL and Redis
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env up -d --wait

      - name: Apply migrations to the dev database (smoke test of db:migrate)
        run: pnpm build:packages && pnpm db:migrate

      - name: Integration tests
        run: pnpm --filter @ogs/api test:integration

      - name: Database and queue logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env logs --no-color

  e2e:
    name: Browser smoke test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env files from templates
        run: pnpm setup:env

      - name: Start PostgreSQL, Redis, Mailpit and the object store
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env up -d --wait

      - name: Migrate and seed the database
        run: pnpm build:packages && pnpm db:migrate && pnpm db:seed

      # Browsers download in seconds; the slow part used to be apt installing
      # Chromium's system libraries from a throttled mirror (12+ minutes). The
      # runner image already ships Chrome, so usually nothing is missing.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ogs/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium headless shell (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ogs/web exec playwright install --only-shell chromium

      - name: Install missing Chromium system libraries
        run: |
          set -euo pipefail
          wanted=$(pnpm --filter @ogs/web exec playwright install-deps --dry-run chromium \
            | grep -oE 'no-install-recommends [^"]*' | head -1 | cut -d' ' -f2- || true)
          if [ -z "$wanted" ]; then
            echo "Could not read the dependency list; installing everything Playwright asks for."
            pnpm --filter @ogs/web exec playwright install-deps chromium
            exit 0
          fi
          missing=""
          for pkg in $wanted; do
            dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "install ok installed" || missing="$missing $pkg"
          done
          if [ -z "$missing" ]; then
            echo "All $(echo $wanted | wc -w) Chromium system libraries are already installed."
          else
            echo "Installing:$missing"
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends $missing
          fi

      - name: Build and run the smoke test
        run: pnpm test:e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
