# OGS local development infrastructure.
#
# Usage (from the repository root):
#   pnpm infra:up        # start PostgreSQL, Redis, Mailpit and the object store
#   pnpm infra:down      # stop (data is kept in named volumes)
#
# Credentials come from the root .env file (see .env.example). Startup fails
# if a required variable is missing, so no default credentials exist.
# Ports bind to 127.0.0.1 only: services are not reachable from the network.
# This file is for development only and must not be used for production.

name: ${COMPOSE_PROJECT_NAME:-ogs}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      # OGS roles (see postgres/init/00-ogs-roles.sh). Re-run on an existing volume with `pnpm db:roles`.
      OGS_OWNER_PASSWORD: ${OGS_OWNER_PASSWORD:?OGS_OWNER_PASSWORD must be set in .env}
      OGS_APP_PASSWORD: ${OGS_APP_PASSWORD:?OGS_APP_PASSWORD must be set in .env}
      OGS_READONLY_PASSWORD: ${OGS_READONLY_PASSWORD:?OGS_READONLY_PASSWORD must be set in .env}
      OGS_MAINT_PASSWORD: ${OGS_MAINT_PASSWORD:?OGS_MAINT_PASSWORD must be set in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is empty; mounted read-only.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      # Read by redis-cli in the healthcheck, so the password is not passed as an argument.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --appendonly
      - 'yes'
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Development/CI email (Phase 3, ADR-025): catches every message the worker sends.
  # Web inbox: http://localhost:8025 . Never used in production.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Development S3-compatible object storage for files (ADR-019, Phase 3B).
  # SeaweedFS replaces MinIO, whose images are no longer publicly pullable.
  # The API only speaks S3, so any S3-compatible service can stand in here.
  objectstore:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    environment:
      OBJECTSTORE_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:?OBJECTSTORE_ACCESS_KEY must be set in .env}
      OBJECTSTORE_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:?OBJECTSTORE_SECRET_KEY must be set in .env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf '{"identities":[{"name":"ogs","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$OBJECTSTORE_ACCESS_KEY" "$$OBJECTSTORE_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=64 -volume.max=0
    ports:
      - '127.0.0.1:${OBJECTSTORE_PORT:-8333}:8333'
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
